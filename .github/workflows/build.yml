# Builds the desktop installers on GitHub.
#
# Release:  git tag desktop-v0.2.0 && git push origin desktop-v0.2.0
#   -> macOS (universal: Apple Silicon + Intel .dmg, signed with our own
#      certificate when the MAC_SIGNING_* secrets are set, else ad hoc),
#      Windows (.exe NSIS installer + .msi) and Linux (.AppImage + .deb)
#      are built and attached to a DRAFT GitHub Release. Review it, then
#      press "Publish".
#
# Test build: Actions tab -> "Build desktop installers" -> Run workflow.
#   Builds all three platforms and keeps the installers as run artifacts
#   (no release is created).
#
# Release without pushing a tag (from a phone, or a session that can't push
#   tags): Run workflow on main with "release_tag" set to desktop-v<version>
#   (the version in tauri.conf.json). The same DRAFT release is made from
#   main; GitHub creates the tag on main when the draft is published.
#
# Auto-update: every build also produces signed update bundles (*.sig) and,
# on tag pushes, a latest.json manifest on the release. Installed apps read
# latest.json from OUR website (endpoint in src-tauri/tauri.conf.json), so
# after a release run scripts/selfhost-latest-json.py and upload the files —
# see README.md "Releasing an update".

name: Build desktop installers

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Make a draft release with this tag (desktop-vX.Y.Z, matching tauri.conf.json); empty for a test build"
        required: false
        default: ""

permissions:
  contents: write # create/update the draft release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_SIGNING_P12 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both Mac targets are needed for the universal binary.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Bundled into the AppImage (bundleMediaFramework) so sound and
          # video play in the app; never -ugly (licence).
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav \
            gstreamer1.0-pulseaudio

      - name: Install dependencies
        run: npm ci

      - name: Run Rust tests
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      # Our own signing certificate (made once, kept in the MAC_SIGNING_P12 and
      # MAC_SIGNING_P12_PASSWORD secrets), so macOS sees every build as the
      # same app: permissions such as Screen Recording survive new builds and
      # updates (an ad-hoc signature changes every build, and macOS then
      # quietly stops applying them). It isn't Apple's Developer ID, so a
      # first install still shows the unidentified-developer warning.
      # Without the secrets, builds stay ad hoc.
      - name: Use the Mac signing certificate
        if: matrix.platform == 'macos-latest' && env.HAS_MAC_CERT == 'true'
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          IDENTITY="CoolerBox Tracker Signing"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MAC_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$MAC_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Self-made, so trust it for code signing on this runner.
          security find-certificate -c "$IDENTITY" -p "$KEYCHAIN" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # A release from Run workflow: only from main, and only for the version
      # being built, so a draft can never carry the wrong tag.
      - name: Check the release tag
        if: ${{ inputs.release_tag != '' && inputs.release_tag != null }}
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Release only from main (this run is on ${{ github.ref }})."; exit 1
          fi
          if [ "${{ inputs.release_tag }}" != "desktop-v$version" ]; then
            echo "release_tag must be desktop-v$version, the version in tauri.conf.json."; exit 1
          fi

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the auto-update bundles (public half is in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Tag pushes (or Run workflow with release_tag) publish to a draft
          # release; other manual runs only build.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('CoolerBox Tracker {0}', github.ref_name) || (inputs.release_tag && format('CoolerBox Tracker {0}', inputs.release_tag)) || '' }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: "Download the installer for your computer below. First launch shows an unsigned-app warning: Mac — right-click the app → Open; Windows — More info → Run anyway."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Check the Mac app's signature
        if: matrix.platform == 'macos-latest'
        run: |
          app="$(find src-tauri/target -path '*/bundle/macos/*.app' -maxdepth 6 | head -n 1)"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier|Authority|Signature|TeamIdentifier' || true
          codesign -d -r- "$app" 2>&1 | tail -n 1 || true

      # Manual (non-tag) runs: keep the installers so they can be downloaded
      # from the run page for testing.
      - name: Upload installers (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release_tag }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.sig
