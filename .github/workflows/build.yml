# Builds the desktop installers on GitHub.
#
# Release:  git tag desktop-v0.2.0 && git push origin desktop-v0.2.0
#   -> macOS (universal: Apple Silicon + Intel .dmg, ad-hoc signed),
#      Windows (.exe NSIS installer + .msi) and Linux (.AppImage + .deb)
#      are built and attached to a DRAFT GitHub Release. Review it, then
#      press "Publish".
#
# Test build: Actions tab -> "Build desktop installers" -> Run workflow.
#   Builds all three platforms and keeps the installers as run artifacts
#   (no release is created).
#
# Auto-update: every build also produces signed update bundles (*.sig) and,
# on tag pushes, a latest.json manifest on the release. Installed apps read
# latest.json from OUR website (endpoint in src-tauri/tauri.conf.json), so
# after a release run scripts/selfhost-latest-json.py and upload the files —
# see README.md "Releasing an update".

name: Build desktop installers

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write # create/update the draft release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both Mac targets are needed for the universal binary.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Bundled into the AppImage (bundleMediaFramework) so sound and
          # video play in the app; never -ugly (licence).
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav \
            gstreamer1.0-pulseaudio

      - name: Install dependencies
        run: npm ci

      - name: Run Rust tests
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the auto-update bundles (public half is in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Tag pushes publish to a draft release; manual runs only build.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('CoolerBox Tracker {0}', github.ref_name) || '' }}
          releaseBody: "Download the installer for your computer below. First launch shows an unsigned-app warning: Mac — right-click the app → Open; Windows — More info → Run anyway."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Manual (non-tag) runs: keep the installers so they can be downloaded
      # from the run page for testing.
      - name: Upload installers (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.sig
