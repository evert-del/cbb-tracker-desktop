# Puts a published release on the tracker's download page.
#
# When a release is published (or by hand for a tag), its installers and
# update files are copied into the tracker's R2 bucket under
# platform/desktop/<version>/, then latest.json (the updater file) and
# current.json (the manifest the tracker reads) are written LAST, so nobody
# is offered a file that isn't there yet. The tracker serves them at
# https://tracker.coolerboxbrothers.com/download (tracker repo:
# src/lib/desktop-app.ts, src/app/download/desktop/[...path]/route.ts).
#
# Uploads through R2's S3 API, which a token limited to one bucket can use
# (the Cloudflare REST API that `wrangler r2 object put` calls refuses such
# a token: 403, found on the first 0.2.3 run). Needs three repo secrets from
# an R2 Account API token with Object Read & Write on cbb-tracker-media
# only: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, and CLOUDFLARE_ACCOUNT_ID.

name: Publish to the tracker's download page

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. desktop-v0.2.3"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-downloads
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      BUCKET: cbb-tracker-media
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # Newer AWS CLIs send checksum headers R2 may not accept; send them only when needed.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the secrets are set
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and CLOUDFLARE_ACCOUNT_ID repo secrets first."
            exit 1
          fi
          case "$TAG" in desktop-v*) ;; *) echo "::error::$TAG is not a desktop-vX.Y.Z tag"; exit 1 ;; esac

      - name: Download the release's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --dir dist

      - name: Prepare the manifest and updater file
        run: python3 scripts/tracker-downloads.py dist "${TAG#desktop-v}" out

      - name: Upload the files, then latest.json, then current.json
        run: |
          set -euo pipefail
          VERSION="${TAG#desktop-v}"
          ENDPOINT="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          put() { aws s3 cp "$2" "s3://$BUCKET/platform/desktop/$1" --endpoint-url "$ENDPOINT" --content-type "$3" --only-show-errors; }
          while read -r name; do
            [ -n "$name" ] && put "$VERSION/$name" "dist/$name" application/octet-stream
          done < out/uploads.txt
          put latest.json out/latest.json application/json
          put current.json out/current.json application/json

      - name: Check the tracker serves it
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS https://tracker.coolerboxbrothers.com/download/desktop/current.json | python3 -c 'import json,sys; m=json.load(sys.stdin); print("Live:", m["version"])'
