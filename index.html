<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved for offline</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Saved for offline</h1>
      <p id="status">Loading…</p>

      <form id="save-form">
        <input id="save-url" placeholder="Paste a call-sheet Download link…" />
        <input id="save-label" placeholder="Label, e.g. Con Spirito S1 Day 1" />
        <button type="submit">Save for offline</button>
      </form>
      <p id="save-msg"></p>

      <ul id="offline-list"></ul>
    </main>
  </body>
</html>
