<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoolerBox Tracker</title>
    <script type="module" src="/src/mini.ts" defer></script>
    <style>
      /* The quick panel (mini.rs): a card inside a transparent window, with
         room around it for its shadow. Tracker pink, light or dark with the OS. */
      :root {
        --pink: #dd347c;
        --pink-ink: #b8246a;
        --card: #ffffff;
        --fg: #1d1b22;
        --muted: #6b6574;
        --faint: #9a94a3;
        --rule: rgba(29, 27, 34, 0.09);
        --tile: #f4f2f6;
        --tile-hover: #ebe8ef;
        --danger-bg: #fdecee;
        --danger-fg: #b4232f;
        --head-in: #dd347c;
        --head-break: #c77d0a;
        --head-out: #3a3644;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --pink-ink: #f27aae;
          --card: #1f1c25;
          --fg: #eeebf2;
          --muted: #aaa3b5;
          --faint: #7d7688;
          --rule: rgba(238, 235, 242, 0.09);
          --tile: #2a2631;
          --tile-hover: #332e3b;
          --danger-bg: #3a1c21;
          --danger-fg: #ff8f98;
          --head-out: #2d2934;
          color-scheme: dark;
        }
      }
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: transparent;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Ubuntu, Cantarell, "Noto Sans", sans-serif;
        color: var(--fg);
        user-select: none; -webkit-user-select: none; cursor: default;
      }
      body { padding: 6px 16px 22px; box-sizing: border-box; }
      #card {
        height: 100%; display: flex; flex-direction: column; overflow: hidden;
        background: var(--card); border-radius: 14px;
        border: 0.5px solid var(--rule);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22), 0 2px 6px rgba(0, 0, 0, 0.12);
      }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; border-radius: 8px; }
      svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      [hidden] { display: none !important; }

      /* Time sheet header: colour carries the state. */
      #head { background: var(--head-out); color: #fff; padding: 14px 16px 16px; transition: background 0.2s; }
      #head[data-state="in"] { background: var(--head-in); }
      #head[data-state="break"] { background: var(--head-break); }
      #head-top { display: flex; align-items: center; gap: 8px; font-size: 12px; }
      #dot { width: 8px; height: 8px; border-radius: 50%; background: #c9c4d1; flex: none; }
      #head[data-state="in"] #dot { background: #8ff0be; }
      #head[data-state="break"] #dot { background: #ffe08a; }
      #status { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.95; }
      .head-btn { color: #fff; opacity: 0.8; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; }
      .head-btn:hover { opacity: 1; background: rgba(255, 255, 255, 0.16); }
      #pin[aria-pressed="true"] { opacity: 1; background: rgba(255, 255, 255, 0.24); }
      #pin[aria-pressed="true"] svg { fill: currentColor; }
      /* Pinned: the header is the handle for dragging the floating timer. */
      #head.pinned { cursor: grab; }
      #head.pinned:active { cursor: grabbing; }
      #pin-hint { font-size: 11px; opacity: 0.8; margin-top: 2px; }
      #timer { font-size: 34px; font-weight: 600; letter-spacing: 0.01em; line-height: 1.15; margin-top: 6px; font-variant-numeric: tabular-nums; }
      #today { font-size: 12px; opacity: 0.88; font-variant-numeric: tabular-nums; }

      #actions { display: flex; gap: 8px; padding: 12px 14px; }
      .act {
        flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
        min-height: 36px; border-radius: 9px; font-weight: 600; font-size: 12.5px;
        background: var(--tile); transition: background 0.15s;
      }
      .act:hover { background: var(--tile-hover); }
      .act.primary { background: var(--pink); color: #fff; }
      .act.primary:hover { background: var(--pink-ink); }
      .act.wrap { background: var(--danger-bg); color: var(--danger-fg); }
      #no-sheet { padding: 12px 16px; color: var(--muted); font-size: 12.5px; }

      .section { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); padding: 8px 16px 4px; }
      #needs { display: flex; flex-direction: column; }
      .need { display: flex; align-items: center; gap: 10px; padding: 8px 16px; text-align: left; border-top: 0.5px solid var(--rule); }
      .need:hover { background: var(--tile); }
      .badge { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
      .need .txt { min-width: 0; flex: 1; }
      .need .body { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .need .label { font-size: 11.5px; color: var(--faint); }
      .need svg { color: var(--faint); }
      #empty { padding: 10px 16px 14px; color: var(--muted); font-size: 12.5px; }
      #see-all { display: flex; align-items: center; gap: 6px; padding: 9px 16px; color: var(--pink-ink); font-weight: 600; border-top: 0.5px solid var(--rule); }
      #see-all:hover { background: var(--tile); }

      #shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 14px; border-top: 0.5px solid var(--rule); margin-top: auto; }
      .tile { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 9px; background: var(--tile); font-weight: 500; }
      .tile:hover { background: var(--tile-hover); }
      .tile svg { color: var(--muted); }

      #foot { display: flex; align-items: center; gap: 4px; padding: 8px 10px 8px 16px; border-top: 0.5px solid var(--rule); color: var(--faint); font-size: 12px; }
      #version { flex: 1; }
      .icon-btn { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; color: var(--muted); }
      .icon-btn:hover { background: var(--tile); color: var(--fg); }

      /* Settings view (gear), in place of the main view. */
      #main-view { display: flex; flex-direction: column; flex: 1; min-height: 0; }
      #settings { display: flex; flex-direction: column; flex: 1; }
      #settings-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px; font-weight: 600; font-size: 14px; border-bottom: 0.5px solid var(--rule); }
      .set-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; text-align: left; border-bottom: 0.5px solid var(--rule); width: 100%; box-sizing: border-box; }
      .set-row:hover { background: var(--tile); }
      .set-row .txt { flex: 1; }
      .set-row .hint { font-size: 11.5px; color: var(--faint); }
      .switch { width: 34px; height: 20px; border-radius: 99px; background: var(--tile-hover); position: relative; flex: none; transition: background 0.15s; }
      .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: transform 0.15s; }
      .switch[aria-checked="true"] { background: var(--pink); }
      .switch[aria-checked="true"]::after { transform: translateX(14px); }
      #quit-row { color: var(--danger-fg); }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="main-view">
        <div id="head" data-state="none">
          <div id="head-top">
            <span id="dot"></span>
            <span id="status">Loading…</span>
            <button id="pin" class="head-btn" type="button" aria-pressed="false" aria-label="Pin as a floating timer" title="Pin as a floating timer">
              <svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 4H6l4-4zM12 14v7"/></svg>
            </button>
            <button id="open-top" class="head-btn" type="button" aria-label="Open tracker" title="Open tracker">
              <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
            </button>
          </div>
          <div id="timer">0:00</div>
          <div id="today"></div>
          <div id="pin-hint" hidden>Pinned. Drag here to move it.</div>
        </div>
        <div id="actions"></div>
        <div id="no-sheet" hidden>The time sheet isn't switched on for you.</div>

        <div class="section" id="needs-label">Needs you</div>
        <div id="needs"></div>
        <div id="empty" hidden>You're all caught up.</div>
        <button id="see-all" type="button">
          <span id="see-all-text">See all notifications</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>

        <div id="shortcuts">
          <button class="tile" id="open-tracker" type="button">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>
            Open tracker
          </button>
          <button class="tile" id="open-offline" type="button">
            <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14l3 3 3-3"/></svg>
            Saved offline
          </button>
        </div>
        <div id="foot">
          <span id="version"></span>
          <button class="icon-btn" id="update" type="button" aria-label="Check for updates" title="Check for updates">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"/></svg>
          </button>
          <button class="icon-btn" id="open-settings" type="button" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
          <button class="icon-btn" id="quit" type="button" aria-label="Quit CoolerBox Tracker" title="Quit">
            <svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
          </button>
        </div>
      </div>

      <div id="settings" hidden>
        <div id="settings-head">
          <button class="icon-btn" id="close-settings" type="button" aria-label="Back" title="Back">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          </button>
          Settings
        </div>
        <button class="set-row" id="autostart-row" type="button" role="switch" aria-checked="false">
          <span class="txt">Launch at login<span class="hint" style="display:block">Start CoolerBox Tracker when you sign in to this computer.</span></span>
          <span class="switch" id="autostart-switch" aria-checked="false"></span>
        </button>
        <button class="set-row" id="update-row" type="button">
          <span class="txt">Check for updates<span class="hint" id="version-hint" style="display:block"></span></span>
        </button>
        <button class="set-row" id="diagnostics-row" type="button">
          <span class="txt">Diagnostics<span class="hint" style="display:block">Versions and connection details for support.</span></span>
        </button>
        <button class="set-row" id="quit-row" type="button">
          <span class="txt">Quit CoolerBox Tracker</span>
        </button>
      </div>
    </div>
  </body>
</html>
