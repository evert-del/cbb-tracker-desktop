[package]
name = "cbb-tracker-desktop"
version = "0.2.28"
description = "CoolerBox Production Tracker — desktop shell (Tauri v2)"
authors = ["CoolerBox Brothers"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cbb_tracker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: transparent windows on macOS (the quick panel's rounded
# card, mini.html). Rules out the Mac App Store, which this app does not use.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
percent-encoding = "2"
# The Adobe review panel's packages are checked against the tracker's SHA-256 before Adobe's installer runs them (adobe_panel.rs).
sha2 = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Same GTK as Tauri's, to set the AppImage's title-bar buttons (title_buttons.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Seconds since the last input, for the time sheet's "you were away" (idle.rs).
# Core Location for the time sheet's location on macOS (location.rs). The
# same version wry already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# The Dock menu (dock.rs): the menu crate Tauri already uses, so its clicks
# arrive with the tray's.
muda = { version = "0.20", default-features = false }

# Clickable notifications (banner.rs): the crates tauri-plugin-notification
# already uses underneath, at the versions it locks, so nothing new is built.
[target.'cfg(target_os = "macos")'.dependencies.mac-notification-sys]
version = "0.6"

[target.'cfg(target_os = "linux")'.dependencies.notify-rust]
version = "4.11"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
# The taskbar jump list (jumplist.rs); the version Tauri already locks.
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
