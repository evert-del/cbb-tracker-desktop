# App-defined permission: the quick panel commands.
# Callable only from the local "mini" window — never the remote main window.
# See src-tauri/src/mini.rs.

[[permission]]
identifier = "allow-mini"
description = "Enables the quick panel commands (clock taps, open, hide, pin, tray-menu items, the mood check-in, the walkie quick chat, what's new, do-not-disturb, search, the next call's map, the project timer)."
commands.allow = ["mini_action", "mini_expand", "mini_expand_notifications", "mini_hide", "mini_open", "mini_menu", "mini_pin", "mini_compact", "mini_mood", "mini_mood_done", "mini_dnd", "mini_search", "mini_open_map", "mini_whats_new", "mini_whats_new_done", "mini_walkie_open", "mini_walkie_send", "mini_hourly", "mini_hourly_idle", "mini_hourly_file", "mini_hourly_add", "mini_hourly_pin"]
