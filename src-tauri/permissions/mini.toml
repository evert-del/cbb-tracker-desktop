# App-defined permission: the quick panel commands.
# Callable only from the local "mini" window — never the remote main window.
# See src-tauri/src/mini.rs.

[[permission]]
identifier = "allow-mini"
description = "Enables the quick panel commands (clock taps, open, hide, pin, tray-menu items, the mood check-in)."
commands.allow = ["mini_action", "mini_expand", "mini_expand_notifications", "mini_hide", "mini_open", "mini_menu", "mini_pin", "mini_compact", "mini_mood", "mini_mood_done"]
